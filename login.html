<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
<style>
body{
    font-family:Poppins,sans-serif;
    background:#f4f9ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.login-box{
    width:300px;
    padding:30px;
    background:white;
    text-align:center;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}
.login-box h2{
    color:#0077b6;
    margin-bottom:20px;
}

.login-box input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}
.login-box button{
    width:100%;
    padding:10px;
    background:#00b4d8;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
.login-box button:hover{
    background:#0077b6;
}
</style>
</head>
<body>
<div class="login-box">
<h2>Travel Explorer</h2>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
<script src="script.js"></script>
</body>
</html>
